image:
  repository: docker.io/j3rrytran/notebook
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 4

ha:
  antiAffinity: soft
  topologyKey: kubernetes.io/hostname

updateStrategy:
  maxUnavailable: 1
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 2

service:
  type: NodePort
  port: 8080
  nodePort: {}
  externalTrafficPolicy: Cluster
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  tls: []
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

existingSecret: notebook-secrets
secretKeys:
  dbPassword: db-password
  authEncryptionKey: auth-encryption-key
  oidcClientSecret: oidc-client-secret
  ldapManagerPassword: ldap-manager-password
  ldapTruststore: ldap-truststore
  # ldapTruststorePassword: ldap-truststore-password

mariadb:
  host: ""
  port: 3306
  database: test
  username: notebook_api
  params: "useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC"
  maxPoolSize: 5

kyuubi:
  restUrl: "http://kyuubi-rest.kyuubi.svc.cluster.local:10099"
  connectTimeout: 10s
  requestTimeout: 60s
  idleSessionTimeout: 30m
  idleReaperIntervalMs: 300000
  pinToInstance: true
  allowedSessionConfigKeys: {}
  extraSessionConfigs: {}

auth:
  mode: ldap
  admins: []
  allowUnverified: false

  oidc:
    issuer: "https://10.29.19.56:32004/realms/lakehouse"
    clientId: kyuubi-notebook
    redirectPath: /auth/callback
    scopes: [openid, profile]
    usernameClaim: preferred_username
    cacheTtl: 60s
    serviceAccount:
      enabled: false
      clientId: notebook-api

  ldap:
    url: "ldaps://freeipa.lab.com:636"
    startTls: false
    baseDn: "cn=accounts,dc=lab,dc=com"
    userDnPattern: "uid={0},cn=users,cn=accounts,dc=lab,dc=com"
    userSearchBase: ""
    userSearchFilter: ""
    usernameAttribute: uid
    managerDn: "uid=kyuubi,cn=users,cn=accounts,dc=lab,dc=com"
    groupSearchBase: "cn=groups,cn=accounts,dc=lab,dc=com"
    groupObjectClass: groupOfNames
    groupMemberAttribute: member
    adminGroup: ""
    connectTimeout: 5s
    readTimeout: 10s
    trustStore:
      enabled: true
      type: PEM

  session:
    ttl: 8h
    recheck: 10m

notebook:
  maxCells: 500
  pageSize: 200
  cellSourceMaxSize: 1Mi
  documentMaxSize: 16Mi
  importMaxSize: 16Mi
  maxRevisions: 100
  resultsMaxRows: 1000
  eventsPoolSize: 16
  eventsMaxWait: 10s

jvm:
  notebookService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"
  executionService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 2Gi }

logLevel: INFO
extraEnv: []

probes:
  startup:   { periodSeconds: 5,  failureThreshold: 60 }
  readiness: { periodSeconds: 5,  failureThreshold: 3 }
  liveness:  { periodSeconds: 10, failureThreshold: 3 }

terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
podAnnotations: {}
podLabels: {}

networkPolicy:
  enabled: false
  ingressFrom: []
  egress:
    mariadb: { cidr: , port: 3306 }
    kyuubi:  { namespace: kyuubi, podLabels: { app.kubernetes.io/name: kyuubi }, port: 10099 }
    keycloak: { cidr: 10.29.19.56/32, port: 32004 }
    ldap: { cidr: "", port: 636 }
    dns: true
