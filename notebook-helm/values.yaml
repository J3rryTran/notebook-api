replicaCount: 2

image:
  repository: docker.io/j3rrytran/notebook
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 32380

ingress:
  enabled: false
  className: nginx
  host: notebook.example.local
  tls: []

kyuubi:
  restUrl: http://kyuubi-rest.kyuubi.svc.cluster.local:10099
  connectTimeout: 10s
  requestTimeout: 60s
  sessionOpenTimeout: 10m
  allowedSessionConfigKeys:
    - spark.executor.memory
    - spark.executor.cores
    - spark.sql.shuffle.partitions
  idleSessionTimeout: 30m

auth:
  mode: oidc # oidc | no-oidc | ldap
  usernameClaim: preferred_username
  cacheTtl: 60s
  sessionTtl: 8h
  recheck: 10m
  allowUnverified: false
  oidc:
    issuer: https://10.29.19.56:32004/realms/lakehouse
    clientId: kyuubi-notebook
    redirectPath: /auth/callback
    scopes: [openid, profile]
    serviceClientId: notebook-api
  ldap:
    url: ldaps://ldap.lakehouse.local:636
    startTls: false
    trustStore: ""
    trustAll: false
    baseDn: dc=lakehouse,dc=local
    userDnPattern: ""
    userSearchBase: ou=people
    userSearchFilter: (uid={0})
    usernameAttribute: uid
    managerDn: ""
    groupSearchBase: ou=groups
    groupMemberAttribute: member
    adminGroup: ""
    connectTimeout: 5s
    readTimeout: 10s


mariadb:
  host: 10.29.19.52
  port: 3306
  database: test
  username: notebook_api
  existingSecret: notebook-secrets
  passwordKey: db-password

secrets:
  existingSecret: notebook-secrets
  internalTokenKey: internal-token
  authEncryptionKey: auth-encryption-key
  oidcClientSecretKey: oidc-client-secret
  ldapManagerPasswordKey: ldap-manager-password

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
