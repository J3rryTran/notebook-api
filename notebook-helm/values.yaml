image:
  repository: docker.io/j3rrytran/notebook
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 4

ha:
  antiAffinity: soft
  topologyKey: kubernetes.io/hostname

updateStrategy:
  maxUnavailable: 1
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 2

service:
  type: NodePort
  port: 8080
  nodePort: {}
  externalTrafficPolicy: Cluster
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: ""
  tls: []
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

existingSecret: notebook-secrets
secretKeys:
  dbPassword: db-password
  authEncryptionKey: auth-encryption-key
  oidcClientSecret: oidc-client-secret
  oidcServiceClientSecret: oidc-service-client-secret
  ldapBindPassword: ldap-bindpw
  ldapServiceAccountPassword: ldap-service-account-password
  ldapTruststore: ldap-truststore
  # ldapTruststorePassword: ldap-truststore-password

mariadb:
  host: ""
  port: 3306
  database: test
  username: notebook_api
  params: "useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC"
  maxPoolSize: 5

kyuubi:
  restUrl: "http://kyuubi-rest.kyuubi.svc.cluster.local:10099"
  connectTimeout: 10s
  requestTimeout: 60s
  idleSessionTimeout: 30m
  idleReaperIntervalMs: 300000
  pinToInstance: true
  allowedSessionConfigKeys: {}
  extraSessionConfigs: {}

auth:
  mode: ldap
  admins: []
  allowUnverified: false

  oidc:
    jwt:
      issuer: "https://10.29.19.56:32004/realms/lakehouse"
      audience: [kyuubi]
      jwksUrl: "http://keycloak-service.keycloak-prod.svc.cluster.local:8080/realms/lakehouse/protocol/openid-connect/certs"
      usernameClaim: preferred_username
      allowedAlgorithms: [RS256]
    ui:
      clientId: kyuubi-notebook
      clientSecret: ""
      scope: "openid profile email"
    authorizationEndpoint: "https://10.29.19.56:32004/realms/lakehouse/protocol/openid-connect/auth"
    endSessionEndpoint: "https://10.29.19.56:32004/realms/lakehouse/protocol/openid-connect/logout"
    tokenEndpoint: "http://keycloak-service.keycloak-prod.svc.cluster.local:8080/realms/lakehouse/protocol/openid-connect/token"
    redirectUri: "http://10.29.19.56:32380/api/v1/auth/callback"
    sessionTimeout: PT4H
    serviceAccount:
      enabled: false
      clientId: notebook-api
      clientSecret: ""

  ldap:
    url: "ldaps://freeipa.lab.com:636"
    baseDN: "cn=accounts,dc=lab,dc=com"
    domain: ""
    binddn: "uid=kyuubi,cn=users,cn=accounts,dc=lab,dc=com"
    bindpw: ""
    guidKey: uid
    userDNPattern: "uid=%s,cn=users,cn=accounts,dc=lab,dc=com"
    groupDNPattern: "cn=%s,cn=groups,cn=accounts,dc=lab,dc=com"
    groupClassKey: groupOfNames
    groupMembershipKey: member
    userMembershipKey: ""
    groupFilter: []
    userFilter: []
    customLDAPQuery: ""
    startTls: false
    connectTimeout: 5s
    readTimeout: 10s
    trustStore:
      enabled: true
      type: PEM
    serviceAccount:
      username: kyuubi
      password: ""

  session:
    ttl: 8h
    recheck: 10m

notebook:
  maxCells: 500
  pageSize: 200
  cellSourceMaxSize: 1Mi
  documentMaxSize: 16Mi
  importMaxSize: 16Mi
  maxRevisions: 100
  resultsMaxRows: 1000
  eventsPoolSize: 16
  eventsMaxWait: 10s

jvm:
  notebookService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"
  executionService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 2Gi }

logLevel: INFO
env: []

terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
podAnnotations: {}
podLabels: {}

networkPolicy:
  enabled: false
  ingressFrom: []
  egress:
    mariadb: { cidr: , port: 3306 }
    kyuubi:  { namespace: kyuubi, podLabels: { app.kubernetes.io/name: kyuubi }, port: 10099 }
    keycloak: { cidr: 10.29.19.56/32, port: 32004 }
    ldap: { cidr: "", port: 636 }
    dns: true
