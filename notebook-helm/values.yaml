# =============================================================================
# Values cho Notebook (all-in-one, contract 2). Mọi giá trị deploy nằm ở file này; template không viết
# cứng giá trị môi trường. Chart kiểm values lúc render (values.schema.json + templates/_helpers.tpl).
# Môi trường: lakehouse thử nghiệm, đăng nhập OIDC (Keycloak realm lakehouse).
# =============================================================================

topology: allInOne              # allInOne | split (split chưa hỗ trợ, render lỗi)

image:
  repository: docker.io/j3rrytran/notebook
  tag: ""                       # rỗng = appVersion trong Chart.yaml
  pullPolicy: IfNotPresent
  pullSecrets: []               # [{name: regcred}]

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# HA
# -----------------------------------------------------------------------------
replicaCount: 4

ha:
  # soft = ưu tiên tách pod theo node, thiếu node vẫn chạy
  # hard = bắt buộc tách; cần ít nhất replicaCount + maxSurge node đủ tài nguyên, nếu không pod Pending
  # none = không đặt anti-affinity
  antiAffinity: soft
  topologyKey: kubernetes.io/hostname   # topology.kubernetes.io/zone để tách theo zone

updateStrategy:                 # rolling update; không được cùng bằng 0
  maxUnavailable: 1             # 4 replica: luôn còn >= 3 pod phục vụ khi update
  maxSurge: 1

podDisruptionBudget:
  enabled: true                 # chỉ render khi replicaCount > 1
  minAvailable: 2               # phải < replicaCount; drain node vẫn giữ >= 2 pod

# -----------------------------------------------------------------------------
# Truy cập
# -----------------------------------------------------------------------------
publicUrl: "http://10.29.19.56:32380"   # địa chỉ người dùng mở; redirect OIDC + cookie Secure (https:// → bật)

service:
  type: NodePort                # NodePort | ClusterIP
  port: 8080
  nodePort: 32380               # 30000-32767; publicUrl phải dùng cổng này
  externalTrafficPolicy: Cluster
  annotations: {}

ingress:
  enabled: false
  className: nginx
  host: ""                      # bắt buộc khi enabled
  tls: []                       # [{secretName: notebook-tls, hosts: [...]}]; khi có thì publicUrl phải https://
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"   # import .ipynb tối đa 16Mi

# -----------------------------------------------------------------------------
# Secret (vận hành tạo trước trên Dashboard; chart chỉ tham chiếu)
# -----------------------------------------------------------------------------
existingSecret: notebook-secrets
secretKeys:                     # tên key trong existingSecret
  dbPassword: db-password                         # luôn cần
  authEncryptionKey: auth-encryption-key          # mode no-oidc / ldap
  oidcClientSecret: oidc-client-secret            # mode oidc + serviceAccount.enabled
  ldapManagerPassword: ldap-manager-password      # mode ldap + userSearchFilter
  ldapTruststore: ldap-truststore                 # mode ldap + trustStore.enabled
  ldapTruststorePassword: ldap-truststore-password  # mode ldap + trustStore (type khác PEM)

# -----------------------------------------------------------------------------
# Lưu trữ (MariaDB)
# -----------------------------------------------------------------------------
mariadb:
  host: "10.29.19.52"
  port: 3306
  database: test
  username: notebook_api
  params: "useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC"
  maxPoolSize: 5                # mỗi JVM; tối đa (4+1 pod) × 2 JVM × 5 = 50 kết nối (MariaDB dùng chung với hệ thống khác)

# -----------------------------------------------------------------------------
# Kyuubi
# -----------------------------------------------------------------------------
kyuubi:
  restUrl: "http://kyuubi-rest.kyuubi.svc.cluster.local:10099"
  connectTimeout: 10s
  requestTimeout: 60s
  idleSessionTimeout: 30m       # session Kyuubi rảnh quá thời gian này thì đóng; 0s = tắt
  idleReaperIntervalMs: 300000  # chu kỳ quét session rảnh
  pinToInstance: true
  allowedSessionConfigKeys:     # cấu hình Spark người dùng được phép đặt
    - spark.executor.memory
    - spark.executor.cores
    - spark.sql.shuffle.partitions
  extraSessionConfigs: {}       # luôn gửi khi mở session; KHÔNG đặt kyuubi.engine.spark.output.mode (render lỗi)

# -----------------------------------------------------------------------------
# Xác thực: chỉ dùng MỘT mode. Khối của mode khác bị bỏ qua.
# -----------------------------------------------------------------------------
auth:
  mode: oidc                    # oidc | no-oidc | ldap
  admins: []                    # username được coi là admin
  allowUnverified: false        # chỉ playground khi Kyuubi authentication=NONE

  oidc:
    issuer: "https://10.29.19.56:32004/realms/lakehouse"   # phải khớp issuer bên Kyuubi
    clientId: kyuubi-notebook   # client PUBLIC cho SPA (PKCE)
    scopes: [openid, profile]
    usernameClaim: preferred_username
    cacheTtl: 60s
    serviceAccount:             # proxy user khi app_users.ranger_username ≠ username
      enabled: false            # bật sau khi kiểm P5.7 trên Kyuubi
      clientId: notebook-api    # client CONFIDENTIAL; secret ở secretKeys.oidcClientSecret

  session:                      # mode no-oidc / ldap
    ttl: 8h
    recheck: 10m

  ldap:                         # mode ldap
    url: ""
    startTls: false             # bắt buộc true với ldap://; phải false với ldaps://
    baseDn: ""
    userDnPattern: ""           # đúng MỘT trong userDnPattern / userSearchFilter
    userSearchBase: ou=people
    userSearchFilter: ""
    usernameAttribute: uid      # AD: sAMAccountName
    managerDn: ""
    groupSearchBase: ou=groups
    groupMemberAttribute: member
    adminGroup: ""
    connectTimeout: 5s
    readTimeout: 10s
    trustStore:
      enabled: false
      type: PKCS12              # PKCS12 | JKS | PEM

# -----------------------------------------------------------------------------
# Giới hạn ứng dụng
# -----------------------------------------------------------------------------
notebook:
  maxCells: 500
  pageSize: 200                 # số notebook tối đa mỗi trang danh sách
  cellSourceMaxSize: 1Mi
  documentMaxSize: 16Mi
  importMaxSize: 16Mi
  maxRevisions: 100
  resultsMaxRows: 1000
  eventsPoolSize: 16
  eventsMaxWait: 10s

# -----------------------------------------------------------------------------
# Runtime pod
# -----------------------------------------------------------------------------
jvm:                            # 2 JVM chung 1 container: tổng ≈ 70% limit, phần còn lại cho nginx + metaspace
  notebookService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"
  executionService: "-XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError"

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: "2",  memory: 2Gi }

logLevel: INFO
extraEnv: []                    # [{name: X, value: Y}]

probes:                         # exec /app/healthcheck.sh (kiểm cả 2 JVM + nginx)
  startup:   { periodSeconds: 5,  failureThreshold: 60 }   # tối đa 5 phút cho Flyway + 2 JVM
  readiness: { periodSeconds: 5,  failureThreshold: 3 }
  liveness:  { periodSeconds: 10, failureThreshold: 3 }

terminationGracePeriodSeconds: 40   # > preStopSleepSeconds + long-poll (eventsMaxWait) + thời gian dừng JVM
preStopSleepSeconds: 5              # chờ Service rút endpoint trước khi nginx dừng

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}                    # khác rỗng thì GHI ĐÈ hoàn toàn ha.antiAffinity
topologySpreadConstraints: []
podAnnotations: {}
podLabels: {}

networkPolicy:
  enabled: false
  ingressFrom: []               # nguồn được vào cổng 8080; rỗng = mọi nơi
  egress:
    mariadb: { cidr: 10.29.19.52/32, port: 3306 }
    kyuubi:  { namespace: kyuubi, podLabels: { app.kubernetes.io/name: kyuubi }, port: 10099 }
    keycloak: { cidr: 10.29.19.56/32, port: 32004 }
    ldap: { cidr: "", port: 636 }
    dns: true
