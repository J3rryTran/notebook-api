{{- if include "notebook.ldapBindpw" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notebook.fullname" . }}-ldap
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
type: Opaque
stringData:
  bindpw: {{ .Values.auth.ldap.bindpw | quote }}
  service-account-password: {{ .Values.auth.ldap.serviceAccount.password | default .Values.auth.ldap.bindpw | quote }}
{{- end }}
