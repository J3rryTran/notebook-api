apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notebook.fullname" . }}-config
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      datasource:
        url: jdbc:mariadb://{{ .Values.mariadb.host }}:{{ .Values.mariadb.port }}/{{ .Values.mariadb.database }}?{{ .Values.mariadb.params }}
        username: {{ .Values.mariadb.username | quote }}
        hikari:
          maximum-pool-size: {{ .Values.mariadb.maxPoolSize }}
      flyway:
        baseline-on-migrate: true
        baseline-version: 1
    server:
      forward-headers-strategy: native
    logging:
      level:
        root: {{ .Values.logLevel }}
    notebook:
      admins: {{ toJson .Values.auth.admins }}
      auth:
        mode: {{ .Values.auth.mode }}
        allow-unverified: {{ .Values.auth.allowUnverified }}
        {{- if eq .Values.auth.mode "oidc" }}
        oidc:
          jwt:
            issuer: {{ .Values.auth.oidc.jwt.issuer | quote }}
            audience: {{ .Values.auth.oidc.jwt.audience | default (list) | toJson }}
            jwks-url: {{ .Values.auth.oidc.jwt.jwksUrl | quote }}
            username-claim: {{ .Values.auth.oidc.jwt.usernameClaim | default "preferred_username" | quote }}
            allowed-algorithms: {{ .Values.auth.oidc.jwt.allowedAlgorithms | default (list "RS256") | toJson }}
          ui:
            client-id: {{ .Values.auth.oidc.ui.clientId | quote }}
            scope: {{ .Values.auth.oidc.ui.scope | default "openid profile email" | quote }}
          authorization-endpoint: {{ .Values.auth.oidc.authorizationEndpoint | quote }}
          token-endpoint: {{ .Values.auth.oidc.tokenEndpoint | quote }}
          end-session-endpoint: {{ .Values.auth.oidc.endSessionEndpoint | default "" | quote }}
          redirect-uri: {{ .Values.auth.oidc.redirectUri | default "" | quote }}
          session-timeout: {{ .Values.auth.oidc.sessionTimeout | default "PT4H" | quote }}
          {{- if .Values.auth.oidc.serviceAccount.enabled }}
          service-client-id: {{ .Values.auth.oidc.serviceAccount.clientId | quote }}
          {{- end }}
        {{- else }}
        session-ttl: {{ .Values.auth.session.ttl }}
        recheck: {{ .Values.auth.session.recheck }}
        {{- if eq .Values.auth.mode "ldap" }}
        ldap:
          url: {{ .Values.auth.ldap.url | quote }}
          base-dn: {{ .Values.auth.ldap.baseDN | default "" | quote }}
          domain: {{ .Values.auth.ldap.domain | default "" | quote }}
          bind-dn: {{ .Values.auth.ldap.binddn | default "" | quote }}
          guid-key: {{ .Values.auth.ldap.guidKey | default "uid" | quote }}
          user-dn-pattern: {{ .Values.auth.ldap.userDNPattern | default "" | quote }}
          group-dn-pattern: {{ .Values.auth.ldap.groupDNPattern | default "" | quote }}
          group-class-key: {{ .Values.auth.ldap.groupClassKey | default "groupOfNames" | quote }}
          group-membership-key: {{ .Values.auth.ldap.groupMembershipKey | default "member" | quote }}
          user-membership-key: {{ .Values.auth.ldap.userMembershipKey | default "" | quote }}
          group-filter: {{ .Values.auth.ldap.groupFilter | default (list) | toJson }}
          user-filter: {{ .Values.auth.ldap.userFilter | default (list) | toJson }}
          custom-ldap-query: {{ .Values.auth.ldap.customLDAPQuery | default "" | quote }}
          start-tls: {{ .Values.auth.ldap.startTls | default false }}
          connect-timeout: {{ .Values.auth.ldap.connectTimeout | default "5s" }}
          read-timeout: {{ .Values.auth.ldap.readTimeout | default "10s" }}
          service-account:
            username: {{ .Values.auth.ldap.serviceAccount.username | quote }}
          {{- if .Values.auth.ldap.trustStore.enabled }}
          trust-store: "/etc/notebook/ldap/truststore"
          trust-store-type: {{ .Values.auth.ldap.trustStore.type | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
      max:
        cells: {{ .Values.notebook.maxCells }}
        page-size: {{ .Values.notebook.pageSize }}
      cell:
        source:
          max-size: {{ include "notebook.bytes" .Values.notebook.cellSourceMaxSize }}
      document:
        max-size: {{ include "notebook.bytes" .Values.notebook.documentMaxSize }}
      import:
        max-size: {{ include "notebook.bytes" .Values.notebook.importMaxSize }}
      revision:
        max-per-notebook: {{ .Values.notebook.maxRevisions }}
      results:
        max-rows: {{ .Values.notebook.resultsMaxRows }}
      events:
        pool-size: {{ .Values.notebook.eventsPoolSize }}
        max-wait: {{ .Values.notebook.eventsMaxWait }}
    kyuubi:
      rest-url: {{ .Values.kyuubi.restUrl | quote }}
      connect-timeout: {{ .Values.kyuubi.connectTimeout }}
      request-timeout: {{ .Values.kyuubi.requestTimeout }}
      idle-session-timeout: {{ .Values.kyuubi.idleSessionTimeout }}
      idle-reaper-interval: {{ int64 .Values.kyuubi.idleReaperIntervalMs }}
      pin-to-instance: {{ .Values.kyuubi.pinToInstance }}
      allowed-session-config-keys: {{ default (list) .Values.kyuubi.allowedSessionConfigKeys | toJson }}
      {{- if .Values.kyuubi.extraSessionConfigs }}
      session-configs:
        {{- toYaml .Values.kyuubi.extraSessionConfigs | nindent 8 }}
      {{- end }}
