{{- include "notebook.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notebook.fullname" . }}
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable }}
      maxSurge: {{ .Values.updateStrategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "notebook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "notebook.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "notebook.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: notebook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          readinessProbe:
            exec:
              command: ["/app/healthcheck.sh", "readiness"]
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/app/healthcheck.sh", "liveness"]
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NOTEBOOK_CONFIG
              value: "/etc/notebook/application.yaml"
            - name: JAVA_OPTS_NOTEBOOK
              value: {{ .Values.jvm.notebookService | quote }}
            - name: JAVA_OPTS_EXECUTION
              value: {{ .Values.jvm.executionService | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.dbPassword }}
            {{- if eq .Values.auth.mode "no-oidc" }}
            - name: NOTEBOOK_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.authEncryptionKey }}
            {{- end }}
            {{- if and (eq .Values.auth.mode "oidc") .Values.auth.oidc.serviceAccount.enabled }}
            - name: NOTEBOOK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.oidcClientSecret }}
            {{- end }}
            {{- if eq .Values.auth.mode "ldap" }}
            - name: NOTEBOOK_LDAP_SERVICE_ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.ldapServiceAccountPassword }}
            {{- end }}
            {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.binddn }}
            - name: NOTEBOOK_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.ldapBindPassword }}
            {{- end }}
            {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.trustStore.enabled (ne .Values.auth.ldap.trustStore.type "PEM") }}
            - name: NOTEBOOK_LDAP_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.ldapTruststorePassword }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/notebook/application.yaml
              subPath: application.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.trustStore.enabled }}
            - name: ldap-truststore
              mountPath: /etc/notebook/ldap/truststore
              subPath: truststore
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "notebook.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.trustStore.enabled }}
        - name: ldap-truststore
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secretKeys.ldapTruststore }}
                path: truststore
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if eq .Values.ha.antiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "notebook.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.ha.topologyKey }}
      {{- else if eq .Values.ha.antiAffinity "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "notebook.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.ha.topologyKey }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
