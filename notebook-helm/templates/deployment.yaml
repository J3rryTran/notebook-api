apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notebook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: NOTEBOOK_AUTH_MODE
              value: {{ .Values.auth.mode | default "oidc" | quote }}
            - name: NOTEBOOK_AUTH_USERNAME_CLAIM
              value: {{ .Values.auth.usernameClaim | default "preferred_username" | quote }}
            - name: KYUUBI_REST_URL
              value: {{ .Values.kyuubi.restUrl | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://{{ .Values.mariadb.host }}:{{ .Values.mariadb.port }}/{{ .Values.mariadb.database }}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.mariadb.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret }}
                  key: {{ .Values.mariadb.passwordKey }}
            - name: NOTEBOOK_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.internalTokenKey }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: NOTEBOOK_AUTH_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: NOTEBOOK_AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: NOTEBOOK_AUTH_OIDC_SCOPES
              value: {{ join "," .Values.auth.oidc.scopes | quote }}
            - name: NOTEBOOK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.oidcClientSecretKey }}
                  optional: true
            {{- end }}
            {{- if ne .Values.auth.mode "oidc" }}
            - name: NOTEBOOK_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.authEncryptionKey }}
            {{- end }}
            {{- if eq .Values.auth.mode "ldap" }}
            - name: NOTEBOOK_AUTH_LDAP_URL
              value: {{ .Values.auth.ldap.url | quote }}
            - name: NOTEBOOK_AUTH_LDAP_START_TLS
              value: {{ .Values.auth.ldap.startTls | quote }}
            - name: NOTEBOOK_AUTH_LDAP_TRUST_STORE
              value: {{ .Values.auth.ldap.trustStore | quote }}
            - name: NOTEBOOK_AUTH_LDAP_TRUST_ALL
              value: {{ .Values.auth.ldap.trustAll | quote }}
            - name: NOTEBOOK_AUTH_LDAP_BASE_DN
              value: {{ .Values.auth.ldap.baseDn | quote }}
            - name: NOTEBOOK_AUTH_LDAP_USER_DN_PATTERN
              value: {{ .Values.auth.ldap.userDnPattern | quote }}
            - name: NOTEBOOK_AUTH_LDAP_USER_SEARCH_BASE
              value: {{ .Values.auth.ldap.userSearchBase | quote }}
            - name: NOTEBOOK_AUTH_LDAP_USER_SEARCH_FILTER
              value: {{ .Values.auth.ldap.userSearchFilter | quote }}
            - name: NOTEBOOK_AUTH_LDAP_USERNAME_ATTRIBUTE
              value: {{ .Values.auth.ldap.usernameAttribute | quote }}
            - name: NOTEBOOK_AUTH_LDAP_MANAGER_DN
              value: {{ .Values.auth.ldap.managerDn | quote }}
            - name: NOTEBOOK_AUTH_LDAP_GROUP_SEARCH_BASE
              value: {{ .Values.auth.ldap.groupSearchBase | quote }}
            - name: NOTEBOOK_AUTH_LDAP_GROUP_MEMBER_ATTRIBUTE
              value: {{ .Values.auth.ldap.groupMemberAttribute | quote }}
            - name: NOTEBOOK_AUTH_LDAP_ADMIN_GROUP
              value: {{ .Values.auth.ldap.adminGroup | quote }}
            - name: NOTEBOOK_AUTH_LDAP_CONNECT_TIMEOUT
              value: {{ .Values.auth.ldap.connectTimeout | quote }}
            - name: NOTEBOOK_AUTH_LDAP_READ_TIMEOUT
              value: {{ .Values.auth.ldap.readTimeout | quote }}
            - name: NOTEBOOK_LDAP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.ldapManagerPasswordKey }}
                  optional: true
            {{- end }}
          livenessProbe:
            exec:
              command:
                - /app/health-probe.sh
                - liveness
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /app/health-probe.sh
                - readiness
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
