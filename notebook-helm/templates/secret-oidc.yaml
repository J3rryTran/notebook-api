{{- if include "notebook.oidcInlineSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notebook.fullname" . }}-oidc
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.oidc.ui.clientSecret }}
  client-secret: {{ . | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.serviceAccount.enabled }}
  {{- with .Values.auth.oidc.serviceAccount.clientSecret }}
  service-client-secret: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
