events {}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Chặn truy cập internal endpoints từ ngoài vào
        location /internal/ {
            return 403;
        }

        # Document service API
        location ~ ^/api/v1/(notebooks|notebook-folders|auth|me) {
            proxy_pass http://nb-document-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Execution service API
        location ~ ^/api/v1/(notebook-sessions|executions|notebook-runtimes|runtime-specs|notebook-status) {
            proxy_pass http://nb-execution-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Frontend SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
