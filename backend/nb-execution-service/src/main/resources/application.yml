server:
  port: 8082
  forward-headers-strategy: native

management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

spring:
  application:
    name: nb-execution-service
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO

notebook:
  internal-token: ${NOTEBOOK_INTERNAL_TOKEN}
  notebook-service-url: "http://127.0.0.1:8084"
  auth:
    mode: oidc
    username-claim: preferred_username
    cache-ttl: 60s
    session-ttl: 8h
    recheck: 10m
    allow-unverified: false
    oidc:
      issuer: ""
      client-id: kyuubi-notebook
      scopes: [openid, profile]
      service-client-id: notebook-api
      service-client-secret: ${NOTEBOOK_OIDC_CLIENT_SECRET:}
    ldap:
      bind-password: ${NOTEBOOK_LDAP_BIND_PASSWORD:}
      service-account:
        username: ""
        password: ${NOTEBOOK_LDAP_SERVICE_ACCOUNT_PASSWORD:}
  results:
    max-rows: 1000
  events:
    pool-size: 16
    max-wait: 10s

kyuubi:
  rest-url: ""
  pin-to-instance: true
  connect-timeout: 10s
  request-timeout: 60s
  idle-session-timeout: 30m
  session-configs:
    kyuubi.session.engine.launch.async: "true"
  allowed-session-config-keys:
    - spark.executor.memory
    - spark.executor.cores
    - spark.sql.shuffle.partitions
