server:
  port: 8082
  forward-headers-strategy: native

management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: nb-execution-service
  datasource:
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

notebook:
  internal-token: ${NOTEBOOK_INTERNAL_TOKEN}
  notebook-service-url: "http://localhost:8080"
  auth:
    mode: oidc
    usernameClaim: preferred_username
    cacheTtl: 60s
    sessionTtl: 8h
    recheck: 10m
    allowUnverified: false
    oidc:
      issuer: https://10.29.19.56:32004/realms/lakehouse
      clientId: kyuubi-notebook
      scopes: [openid, profile]
      serviceClientId: notebook-api
      serviceClientSecret: ${NOTEBOOK_OIDC_CLIENT_SECRET:}
  results:
    max-rows: 1000

kyuubi:
  rest-url: http://localhost:10099
  pin-to-instance: true
  session-configs:
    kyuubi.session.engine.launch.async: "true"
  allowed-session-config-keys:
    - spark.executor.memory
    - spark.executor.cores
    - spark.sql.shuffle.partitions
