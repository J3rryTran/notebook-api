server:
  port: 8082
  forward-headers-strategy: native

management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

spring:
  application:
    name: nb-execution-service
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO

notebook:
  internal-token: ${NOTEBOOK_INTERNAL_TOKEN}
  encryption-key: ${NOTEBOOK_AUTH_ENCRYPTION_KEY:}
  notebook-service-url: "http://127.0.0.1:8084"
  auth:
    mode: oidc
    session-ttl: 8h
    recheck: 10m
    allow-unverified: false
    oidc:
      jwt:
        issuer: ""
        audience: []
        jwks-url: ""
        username-claim: preferred_username
        allowed-algorithms: [RS256]
        clock-skew: 30s
        connect-timeout: 5s
        read-timeout: 5s
      ui:
        client-id: kyuubi-notebook
        client-secret: ${NOTEBOOK_OIDC_UI_CLIENT_SECRET:}
        scope: "openid profile email"
      authorization-endpoint: ""
      token-endpoint: ""
      end-session-endpoint: ""
      redirect-uri: ""
      session-timeout: PT4H
      service-client-id: notebook-api
      service-client-secret: ${NOTEBOOK_OIDC_CLIENT_SECRET:}
    ldap:
      bind-password: ${NOTEBOOK_LDAP_BIND_PASSWORD:}
      service-account:
        username: ""
        password: ${NOTEBOOK_LDAP_SERVICE_ACCOUNT_PASSWORD:}
  results:
    max-rows: 1000
  events:
    pool-size: 16
    max-wait: 10s

kyuubi:
  rest-url: ""
  pin-to-instance: true
  connect-timeout: 10s
  request-timeout: 60s
  idle-session-timeout: 30m
  session-configs:
    kyuubi.session.engine.launch.async: "true"
  allowed-session-config-keys:
    - spark.executor.memory
    - spark.executor.cores
    - spark.sql.shuffle.partitions
