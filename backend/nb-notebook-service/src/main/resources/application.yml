server:
  port: 8080
  forward-headers-strategy: native

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: nb-notebook-service
  datasource:
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

notebook:
  auth:
    mode: oidc
    usernameClaim: preferred_username
    cacheTtl: 60s
    sessionTtl: 8h
    recheck: 10m
    allowUnverified: false
    oidc:
      issuer: https://10.29.19.56:32004/realms/lakehouse
      clientId: kyuubi-notebook
      scopes: [openid, profile]
    ldap:
      url: ""
      startTls: false
      trustStore: ""
      trustAll: false
      baseDn: ""
      userDnPattern: ""
      userSearchBase: ou=people
      userSearchFilter: (uid={0})
      usernameAttribute: uid
      managerDn: ""
      managerPassword: ${NOTEBOOK_LDAP_MANAGER_PASSWORD:}
      groupSearchBase: ou=groups
      groupMemberAttribute: member
      adminGroup: ""
      connectTimeout: 5s
      readTimeout: 10s
  encryptionKey: ${NOTEBOOK_AUTH_ENCRYPTION_KEY:}
  internalToken: ${NOTEBOOK_INTERNAL_TOKEN}
  admins: []
  cell:
    source:
      max-size: 1048576
  max:
    cells: 500
    page-size: 200
  revision:
    max-per-notebook: 100
  import:
    max-size: 16777216

kyuubi:
  rest-url: http://localhost:10099
