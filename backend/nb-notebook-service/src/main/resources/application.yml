server:
  port: 8080
  forward-headers-strategy: native

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

spring:
  application:
    name: nb-notebook-service
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO

notebook:
  internal-token: ${NOTEBOOK_INTERNAL_TOKEN}
  encryption-key: ${NOTEBOOK_AUTH_ENCRYPTION_KEY:}
  admins: []
  auth:
    mode: oidc
    username-claim: preferred_username
    cache-ttl: 60s
    session-ttl: 8h
    recheck: 10m
    allow-unverified: false
    oidc:
      issuer: ""
      client-id: kyuubi-notebook
      scopes: [openid, profile]
      service-client-id: notebook-api
      service-client-secret: ${NOTEBOOK_OIDC_CLIENT_SECRET:}
    ldap:
      url: ""
      base-dn: ""
      domain: ""
      bind-dn: ""
      bind-password: ${NOTEBOOK_LDAP_BIND_PASSWORD:}
      guid-key: uid
      user-dn-pattern: ""
      group-dn-pattern: ""
      group-class-key: groupOfNames
      group-membership-key: member
      user-membership-key: ""
      group-filter: []
      user-filter: []
      custom-ldap-query: ""
      start-tls: false
      trust-store: ""
      trust-store-password: ${NOTEBOOK_LDAP_TRUSTSTORE_PASSWORD:}
      trust-store-type: PKCS12
      trust-all: false
      connect-timeout: 5s
      read-timeout: 10s
      service-account:
        username: ""
        password: ${NOTEBOOK_LDAP_SERVICE_ACCOUNT_PASSWORD:}
  cell:
    source:
      max-size: 1048576
  max:
    cells: 500
    page-size: 200
  document:
    max-size: 16777216
  revision:
    max-per-notebook: 100
  import:
    max-size: 16777216

kyuubi:
  rest-url: ""
