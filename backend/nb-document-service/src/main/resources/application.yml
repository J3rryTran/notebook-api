server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: nb-document-service
  flyway:
    enabled: true
    schemas: nb_document
    default-schema: nb_document
    table: flyway_schema_history
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: nb_document

notebook:
  internal-token: "dev-internal-secret-token"
  admins:
    - admin
  cell:
    source:
      max-size: 1048576
  max:
    cells: 500
    page-size: 200
  revision:
    max-per-notebook: 100
  import:
    max-size: 16777216

kyuubi:
  rest-url: http://localhost:10099
