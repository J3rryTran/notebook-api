version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: notebook-mariadb-dev
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test
      MYSQL_USER: notebook_api
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
